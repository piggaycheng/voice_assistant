services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-stt
    ports:
      - "8000:8000"
    volumes:
      # 將 host 當前目錄 (src/stt) mount 到容器內 /app（包含 .venv、models 與程式碼）
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_DOWNLOAD_ROOT=/app/models
      - HF_HOME=/app/models
      - SILENCE_THRESHOLD=0.035
      - SILENCE_DURATION=0.8
      - MIN_SPEECH_DURATION=0.5
      - CONSECUTIVE_FRAMES=3
    stdin_open: true
    tty: true
