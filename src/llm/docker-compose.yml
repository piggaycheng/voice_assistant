services:
  llm:
    image: ollama/ollama:latest
    container_name: voice-assistant-llm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # 持久化儲存下載的模型（對應 host 端的 ./models）
      - ./models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    # 容器啟動後自動預載 qwen3.5:4b 模型進顯存
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3; ollama run qwen3.5:4b ''; wait"]
    # 若具備 NVIDIA GPU 並已安裝 nvidia-container-toolkit，可啟用 GPU 加速：
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
