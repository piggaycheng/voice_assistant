services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-stt
    ports:
      - "8002:8000"
    volumes:
      # 將 host 當前目錄 (src/stt) mount 到容器內 /app（包含 .venv、models 與程式碼）
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_DOWNLOAD_ROOT=/app/models
      - HF_HOME=/app/models
      - VAD_THRESHOLD=0.35
      - VAD_NEG_THRESHOLD=0.20
      - PRE_ROLL_CHUNKS=14
      - SILENCE_DURATION=0.8
      - MIN_SPEECH_DURATION=0.4
      - CONSECUTIVE_FRAMES=1
      # Hermes Agent 串接設定
      - ENABLE_LLM=true
      - HERMES_BASE_URL=http://host.docker.internal:8642
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_MODEL=hermes-agent
      - HERMES_TIMEOUT=180
      - LLM_SYSTEM_PROMPT=你是一個親切的繁體中文語音助理，回答請簡明扼要，使用口語自然流暢的口吻。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
