services:
  llm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: voice-assistant-llm
    restart: unless-stopped
    ipc: host
    ports:
      - "11434:8000"
    volumes:
      - ./hg_models:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - ${VLLM_MODEL:-cyankiwi/Qwen3.5-4B-AWQ-4bit}
      - --served-model-name
      - qwen3.5:4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-65536}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-16}
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --language-model-only
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]