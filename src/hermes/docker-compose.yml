services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: voice-assistant-hermes
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/hermes-init.sh"]
    command: gateway run
    ports:
      - "8642:8642"
    volumes:
      - ./data:/opt/data
      - ./config.yaml:/opt/hermes-config.yaml:ro
      - ./init-config.sh:/opt/hermes-init.sh:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_KEY:?Set HERMES_API_KEY before starting Hermes}
      - OPENAI_API_KEY=ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
