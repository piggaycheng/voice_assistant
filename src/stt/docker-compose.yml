services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-stt
    ports:
      - "8002:8000"
    volumes:
      # 將 host 當前目錄 (src/stt) mount 到容器內 /app（包含 .venv、models 與程式碼）
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_DOWNLOAD_ROOT=/app/models
      - HF_HOME=/app/models
      - VAD_THRESHOLD=0.35
      - VAD_NEG_THRESHOLD=0.20
      - PRE_ROLL_CHUNKS=14
      - SILENCE_DURATION=0.8
      - MIN_SPEECH_DURATION=0.4
      - CONSECUTIVE_FRAMES=1
      # OpenAI 相容 LLM 串接設定
      - ENABLE_LLM=true
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=${LLM_API_KEY:-dummy-key}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:4b}
      - LLM_TIMEOUT=180
      # RAG 檢索設定
      - RAG_BASE_URL=http://host.docker.internal:8003
      - RAG_TOP_K=3
      - RAG_TIMEOUT=10
      - LLM_SYSTEM_PROMPT=你是盟立官方知識庫語音助理。只能依據提供的參考資料回答，不得依模型記憶補充。若參考資料沒有答案，請直接回答知識庫中沒有足夠資訊。回答限制在 1 至 2 句、30 字以內，只提供最重要資訊，不要重述問題，使用口語自然流暢的口吻。不得提及資料來源、檔案名稱、路徑、搜尋過程或工具使用情形，也不要附上引用或參考連結；只直接回答結果。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
