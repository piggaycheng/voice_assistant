services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant-stt
    ports:
      - "8002:8000"
    volumes:
      # 將 host 當前目錄 (src/stt) mount 到容器內 /app（包含 .venv、models 與程式碼）
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - WHISPER_MODEL=large-v3-turbo
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_DOWNLOAD_ROOT=/app/models
      - HF_HOME=/app/models
      - VAD_THRESHOLD=0.35
      - VAD_NEG_THRESHOLD=0.20
      - PRE_ROLL_CHUNKS=14
      - SILENCE_DURATION=0.8
      - MIN_SPEECH_DURATION=0.4
      - CONSECUTIVE_FRAMES=1
      - ENABLE_NOISE_SUPPRESSION=true
      - NOISE_REDUCTION_STRENGTH=1.25
      - MAX_NORMALIZATION_GAIN=3.0
      # OpenAI 相容 LLM 串接設定
      - ENABLE_LLM=true
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_API_KEY=${LLM_API_KEY:-dummy-key}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:4b}
      - LLM_TIMEOUT=180
      # RAG 檢索設定
      - RAG_BASE_URL=http://host.docker.internal:8003
      - RAG_TOP_K=3
      - RAG_TIMEOUT=10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
